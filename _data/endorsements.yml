# Endorsements from the homepage "Praise" section that name a specific book.
prince-martin-and-the-last-centaur:
  - quote: "As dads, Prince Martin and the Last Centaur is exactly the type of book we want our kids to be reading. Adventure-seeking boys, in particular, will love it."
    cite: "Adam Minihan and David Niles, hosts of “The Catholic Man Show”"
  - quote: "Brandon Hale and Jason Zimdars have done it again. In this fifth installment in their epic fantasy series named after its hero, Hale’s poetic prose beats and rhymes with fine ballad-like effect on the ear. Zimdars’ illustrations arrest the eye with vivid images of creatures winsome and horrible. And good defeats evil in surprisingly plotted ways. It’s no easy, smarmy victory but one well-fought and grace-filled."
    cite: "Ralph C. Wood, author of The Gospel According to Tolkien: Visions of the Kingdom in Middle-earth"
  - quote: "Epic, timeless, and fun! As the mother of many sons, and now grandsons, I know how rare it is to find an adventurous book for boys set in a moral universe that projects virtue and right order. My youngest son grabbed Prince Martin and the Last Centaur and couldn’t put it down."
    cite: "Leila Miller, author of Raising Chaste Catholic Men, and Made This Way: How to Prepare Kids to Face Today’s Tough Moral Issues (co-authored with Trent Horn)"
prince-martin-and-the-cave-bear:
  - quote: "Another riveting read in the Prince Martin series! Prince Martin and the Cave Bear is filled with themes that I want my children to ponder—hope amidst fear, protecting the vulnerable, fighting for justice... Every time we finish a Prince Martin story, we are already itching for another!"
    cite: "Katie Warner, Author & Editor of the FirstFaithTreasury.com series and A Parent Who Prays"
