{%- assign s = page.series -%}{%- capture sname %}{% include series-name.html series=s %}{% endcapture -%}
{%- assign sbooks = site.data.books | where: "series", s | sort: "book_number" -%}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BookSeries",
  "@id": {{ page.url | absolute_url | append: "#series" | jsonify }},
  "name": {{ sname | jsonify }},
  "url": {{ page.url | absolute_url | jsonify }},
  "description": {{ page.description | jsonify }},
  "inLanguage": "en",
  {% include people-refs.html %},
  "hasPart": [{% for b in sbooks %}
    { "@type": "Book", "@id": {{ "/products/" | append: b.slug | append: "/" | absolute_url | append: "#book" | jsonify }}, "name": {{ b.book_title | jsonify }}, "position": {{ b.book_number }}, "url": {{ "/products/" | append: b.slug | append: "/" | absolute_url | jsonify }} }{% unless forloop.last %},{% endunless %}{% endfor %}
  ]
}
</script>
