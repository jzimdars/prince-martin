{%- assign bb_total = site.data.books | where: "series", include.series | size -%}
<svg class="book-badge book-badge--{{ include.series }}" viewBox="0 0 100 100" aria-hidden="true" focusable="false"><defs><radialGradient id="bb-g-{{ include.id }}" cx="38%" cy="32%" r="75%"><stop offset="0" class="book-badge__hi"/><stop offset="0.55" class="book-badge__mid"/><stop offset="1" class="book-badge__lo"/></radialGradient><path id="bb-top-{{ include.id }}" d="M 19 50 A 31 31 0 0 1 81 50"/><path id="bb-bot-{{ include.id }}" d="M 14 50 A 36 36 0 0 0 86 50"/></defs><circle class="book-badge__ring" cx="50" cy="50" r="48"/><circle class="book-badge__disc" cx="50" cy="50" r="44.5" fill="url(#bb-g-{{ include.id }})"/><circle class="book-badge__rim" cx="50" cy="50" r="43"/><text class="book-badge__label"><textPath href="#bb-top-{{ include.id }}" startOffset="50%" text-anchor="middle">BOOK</textPath></text><text class="book-badge__num" x="50" y="49" text-anchor="middle" dominant-baseline="central">{{ include.n }}</text>{% if bb_total > 0 %}<text class="book-badge__label book-badge__label--bottom"><textPath href="#bb-bot-{{ include.id }}" startOffset="50%" text-anchor="middle">OF {{ bb_total }}</textPath></text>{% endif %}</svg>
