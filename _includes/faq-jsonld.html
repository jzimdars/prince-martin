{%- comment -%} FAQPage structured data built from _data/faq.yml (same text as the visible answers). {%- endcomment -%}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "url": {{ page.url | absolute_url | jsonify }},
  "mainEntity": [{% for section in site.data.faq %}{% for item in section.questions %}
    {
      "@type": "Question",
      "name": {{ item.q | jsonify }},
      "acceptedAnswer": { "@type": "Answer", "text": {{ item.a | strip_html | normalize_whitespace | strip | jsonify }} }
    }{% unless forloop.last %},{% endunless %}{% endfor %}{% unless forloop.last %},{% endunless %}{% endfor %}
  ]
}
</script>
