{%- assign bm = include.book_meta -%}
{%- capture series_name %}{% include series-name.html series=bm.series %}{% endcapture -%}
{%- assign page_url = page.url | absolute_url -%}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Book",
  "@id": {{ page_url | append: "#book" | jsonify }},
  "name": {{ page.book_title | jsonify }},
  "url": {{ page_url | jsonify }},
  "description": {{ page.description | jsonify }},
  "image": {{ page.cover_image | absolute_url | jsonify }},
  "inLanguage": "en",
  {% include people-refs.html %}{% if page.age_range %},
  "typicalAgeRange": {{ page.age_range | jsonify }}{% endif %}{% if page.pages %},
  "numberOfPages": {{ page.pages }}{% endif %}{% if bm.series != "coloring" %},
  "isPartOf": { "@type": "BookSeries", "@id": {{ site.data.series[bm.series].url | absolute_url | append: "#series" | jsonify }}, "name": {{ series_name | jsonify }}, "url": {{ site.data.series[bm.series].url | absolute_url | jsonify }} },
  "position": {{ bm.book_number }}{% endif %},
  "workExample": [{% for ed in page.isbns %}
    { "@type": "Book", "bookFormat": "https://schema.org/{% if ed.format contains 'Hardcover' %}Hardcover{% else %}Paperback{% endif %}", "bookEdition": {{ ed.format | jsonify }}, "isbn": {{ ed.isbn | jsonify }} }{% unless forloop.last %},{% endunless %}{% endfor %}
  ],
  "sameAs": [{% for f in page.amazon_formats %}{{ f.url | jsonify }}, {% endfor %}{% for r in page.other_retailers %}{{ r.url | jsonify }}{% unless forloop.last %}, {% endunless %}{% endfor %}]
}
</script>
